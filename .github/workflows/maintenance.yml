name: Quarterly website maintenance

on:
  schedule:
    # January, April, July, and October at 09:00 Arizona time (UTC-7).
    - cron: "0 16 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quarterly-website-maintenance
  cancel-in-progress: false

jobs:
  review:
    name: Prepare maintenance review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate advisory report
        id: report
        shell: bash
        run: |
          set +e
          npm run maintenance > maintenance-report.txt 2>&1
          report_status=$?
          echo "exit_code=${report_status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Open or update maintenance issue
        uses: actions/github-script@v8
        env:
          REPORT_EXIT_CODE: ${{ steps.report.outputs.exit_code }}
        with:
          script: |
            const fs = require("node:fs");

            const title = "Quarterly website maintenance review";
            const now = new Date();
            const quarter = Math.floor(now.getUTCMonth() / 3) + 1;
            const report = fs.readFileSync("maintenance-report.txt", "utf8").trim();
            const body = [
              `## ${now.getUTCFullYear()} Q${quarter} review`,
              "",
              "This scheduled reminder is advisory and does not block deployment.",
              "",
              ...(process.env.REPORT_EXIT_CODE === "0"
                ? []
                : [
                    "> The report command exited unexpectedly. Review its output below before updating the site.",
                    "",
                  ]),
              "### Checklist",
              "",
              "- [ ] Add new publications and public preprints.",
              "- [ ] Check whether submitted or in-revision manuscripts have been published.",
              "- [ ] Update publication metadata, links, and source-checked dates together.",
              "- [ ] Confirm the current position, affiliation, public email, and external profiles.",
              "- [ ] Check research figures, captions, alt text, and public-source provenance.",
              "- [ ] Review the generated reminders and run `npm test` after any changes.",
              "",
              "### Generated report",
              "",
              "```text",
              report || "No report output was produced.",
              "```",
              "",
              `_Updated automatically by [workflow run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join("\n");

            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title \"${title}\"`;
            const result = await github.rest.search.issuesAndPullRequests({ q: query });
            const existing = result.data.items.find(
              (item) => !item.pull_request && item.title === title,
            );

            if (existing) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
              core.info(`Created issue #${created.data.number}.`);
            }
